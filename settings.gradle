pluginManagement {
    repositories {
        gradlePluginPortal()
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("androidx.*")
                includeGroupByRegex("com\\.google.*")
            }
        }
        mavenCentral()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("androidx.*")
                includeGroupByRegex("com\\.google.*")
            }
        }
    }
}

rootProject.name = "EUC BLE Library"

// Pure Kotlin/JVM core: protocols, models, frames. No Android dependency.
include ":euc-ble-core"

// Android connector (BLEManager, EucBleClient). Opt out with -Peuc.includeAndroid=false
// to build and test the pure core without an Android SDK.
def includeAndroid = providers.gradleProperty("euc.includeAndroid").getOrElse("true").toBoolean()
if (includeAndroid) {
    include ":euc-ble-android"
}
