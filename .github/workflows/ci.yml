name: CI – Quality

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Test quality reporting
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -v

      - name: Run unit tests + coverage reports
        id: tests
        if: ${{ !cancelled() }}
        run: >
          ./gradlew :euc-ble-core:testDebugUnitTest
          --tests
          io.github.tritbool.euc.ble.AllTests
          :euc-ble-core:jacocoTestReport
          :euc-ble-core:jacocoFocusedReport
          -PmaxParallelForks=1
          --no-daemon
          --stacktrace
          -Dkotlinx.coroutines.io.parallelism=4
        env:
          GRADLE_OPTS: "-Xmx2g -Dfile.encoding=UTF-8"
          CI: "true"

      - name: Android Lint
        id: lint
        if: ${{ !cancelled() }}
        run: ./gradlew :euc-ble-core:lintDebug --no-daemon --stacktrace
        env:
          CI: "true"

      - name: Submit SonarCloud analysis
        id: sonar_scan
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          CI: "true"
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SonarCloud requires SONAR_TOKEN; fork changes need a reviewed trusted-branch PR."
            exit 1
          fi
          ./gradlew :euc-ble-core:sonar --no-daemon \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.scm.revision="$GITHUB_SHA"

      - name: SonarCloud quality gate and commit-matched results
        id: sonar
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
        run: python3 scripts/sonar_results.py
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Coverage summary (protocols/models/frames)
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          focused_report = Path("euc-ble-core/build/reports/jacoco/focused/jacoco.xml")
          full_report    = Path("euc-ble-core/build/reports/jacoco/full/jacoco.xml")
          summary = Path(".coverage-summary.md")

          if not focused_report.exists():
              summary.write_text(
                  "## Coverage (protocols/models/frames)\n\n"
                  "Coverage XML not found at "
                  "`euc-ble-core/build/reports/jacoco/focused/jacoco.xml`.\n"
                  "Ensure `:euc-ble-core:jacocoFocusedReport` completed successfully.\n"
              )
              raise SystemExit(0)

          def ratio(root, counter_type):
              covered, missed = 0, 0
              for pkg in root.findall("package"):
                  for c in pkg.findall("counter"):
                      if c.attrib.get("type") == counter_type:
                          covered += int(c.attrib.get("covered", "0"))
                          missed  += int(c.attrib.get("missed",  "0"))
              total = covered + missed
              return covered, missed, (covered / total * 100.0) if total else 0.0

          def pkg_ratio(pkg, counter_type):
              for c in pkg.findall("counter"):
                  if c.attrib.get("type") == counter_type:
                      cov  = int(c.attrib.get("covered", "0"))
                      miss = int(c.attrib.get("missed",  "0"))
                      tot  = cov + miss
                      return cov, miss, (cov / tot * 100.0) if tot else 0.0
              return 0, 0, 0.0

          focused_root = ET.parse(focused_report).getroot()
          lines    = ratio(focused_root, "LINE")
          branches = ratio(focused_root, "BRANCH")

          out = [
              "## Coverage (protocols/models/frames)\n",
              f"- Line coverage: **{lines[2]:.2f}%** ({lines[0]} covered / {lines[1]} missed)",
              f"- Branch coverage: **{branches[2]:.2f}%** ({branches[0]} covered / {branches[1]} missed)",
              "- Full report: `euc-ble-core/build/reports/jacoco/full/html/index.html`",
              "- Focused report: `euc-ble-core/build/reports/jacoco/focused/html/index.html`",
              "",
              "### Per-package breakdown (focused)",
              "",
              "| Package | Line % | Lines (cov/miss) | Branch % | Branches (cov/miss) |",
              "|---------|-------:|-----------------|----------:|--------------------|",
          ]

          pkgs = sorted(focused_root.findall("package"), key=lambda p: p.attrib.get("name", ""))
          for pkg in pkgs:
              name = pkg.attrib.get("name", "").replace("com/euc/ble/", "").replace("/", ".")
              if not name:
                  name = "(root)"
              lc = pkg_ratio(pkg, "LINE")
              bc = pkg_ratio(pkg, "BRANCH")
              out.append(
                  f"| `{name}` | {lc[2]:.1f}% | {lc[0]}/{lc[1]} | {bc[2]:.1f}% | {bc[0]}/{bc[1]} |"
              )

          if full_report.exists():
              full_root = ET.parse(full_report).getroot()
              fl = ratio(full_root, "LINE")
              fb = ratio(full_root, "BRANCH")
              out += [
                  "",
                  "### Full module coverage",
                  "",
                  f"- Line coverage: **{fl[2]:.2f}%** ({fl[0]} covered / {fl[1]} missed)",
                  f"- Branch coverage: **{fb[2]:.2f}%** ({fb[0]} covered / {fb[1]} missed)",
              ]

          summary.write_text("\n".join(out) + "\n")
          PY
          cat .coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: WheelLog protocol test summary
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          reports_dir = Path("euc-ble-core/build/test-results/testDebugUnitTest")
          out_file = Path(".wheellog-summary.md")
          files = sorted(reports_dir.glob("TEST-io.github.tritbool.euc.ble.protocols.WheelLog*.xml"))

          if not files:
              out_file.write_text("## WheelLog protocol test summary\n\nNo WheelLog test reports found.\n")
              raise SystemExit(0)

          lines = [
              "## WheelLog protocol test summary",
              "",
              "| Test class | Tests | Failed | Skipped | Time (s) |",
              "|---|---:|---:|---:|---:|",
          ]

          total_tests = total_failed = total_skipped = 0
          total_time = 0.0

          for xml_file in files:
              root = ET.parse(xml_file).getroot()
              name = root.attrib.get("name", xml_file.stem.replace("TEST-", ""))
              tests = int(root.attrib.get("tests", "0"))
              failures = int(root.attrib.get("failures", "0")) + int(root.attrib.get("errors", "0"))
              skipped = int(root.attrib.get("skipped", "0"))
              time_s = float(root.attrib.get("time", "0"))

              total_tests += tests
              total_failed += failures
              total_skipped += skipped
              total_time += time_s

              short_name = name.split(".")[-1]
              lines.append(f"| `{short_name}` | {tests} | {failures} | {skipped} | {time_s:.2f} |")

          lines.extend([
              "",
              f"**Totals:** tests={total_tests}, failed={total_failed}, skipped={total_skipped}, time={total_time:.2f}s"
          ])

          out_file.write_text("\n".join(lines) + "\n")
          PY
          cat .wheellog-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            euc-ble-core/build/reports/tests/
            euc-ble-core/build/reports/jacoco/
          retention-days: 7

      - name: Generate website quality snapshot
        if: ${{ !cancelled() }}
        run: python3 scripts/quality_report.py
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          SONAR_OUTCOME: ${{ steps.sonar.outcome }}
          CHECK_OUTCOME: ${{ job.status }}

      - name: Collect website reports
        if: ${{ !cancelled() }}
        run: |
          mkdir -p quality/reports
          if [ -d euc-ble-core/build/reports/tests/testDebugUnitTest ]; then
            cp -r euc-ble-core/build/reports/tests/testDebugUnitTest quality/reports/tests
          fi
          if [ -f euc-ble-core/build/reports/lint-results-debug.html ]; then
            mkdir -p quality/reports/lint
            cp euc-ble-core/build/reports/lint-results-debug.html quality/reports/lint/index.html
          fi
          for scope in full focused; do
            if [ -d "euc-ble-core/build/reports/jacoco/$scope/html" ]; then
              mkdir -p quality/reports/coverage
              cp -r "euc-ble-core/build/reports/jacoco/$scope/html" "quality/reports/coverage/$scope"
            fi
          done

      - name: Upload website quality snapshot
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: website-quality
          path: quality/
          if-no-files-found: error
          retention-days: 30
