name: Publish to Maven Central

on:
  release:
    types: [published]   # déclenché quand un Release (ou Pre-release) est publié

jobs:
  publish:
    # Use the Apple build environment for multiplatform releases.
    runs-on: macos-latest
    # Si un jour tu veux exclure les pre-releases :
    # if: "!github.event.release.prerelease"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests + coverage reports
        run: >
          ./gradlew :euc-ble-core:test
          --tests io.github.tritbool.euc.ble.AllTests
          :euc-ble-core:jacocoTestReport
          :euc-ble-core:jacocoFocusedReport
          :euc-ble-android:testDebugUnitTest
          --tests io.github.tritbool.euc.ble.AndroidTests
          -PmaxParallelForks=1
          --no-daemon
          --stacktrace
          -Dkotlinx.coroutines.io.parallelism=4
        env:
          CI: true

      - name: Publish to Maven Central
        run: >
          ./gradlew :euc-ble-protocols:publishAllPublicationsToMavenCentralRepository
          :euc-ble-session:publishAllPublicationsToMavenCentralRepository
          :euc-ble-core:publishAllPublicationsToMavenCentralRepository
          :euc-ble-android:publishAllPublicationsToMavenCentralRepository
          --no-daemon
          --stacktrace
        env:
          CI: true
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_SIGNING_KEY_ID }}
